# Colors / truecolor
# tmux-256color is the modern terminfo; RGB feature enables 24-bit truecolor
# (Ghostty + Catppuccin theme are truecolor).
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# Remove the ESC key delay so leaving insert mode in nvim is instant.
set -sg escape-time 0
# Let nvim/programs know when the terminal gains/loses focus.
set -g focus-events on


# statusbar
set -g status-position bottom
set -g status-justify left
set -g status-left ''
set -g status-right '%Y-%m-%d %H:%M'
