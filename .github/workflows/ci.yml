name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: shellcheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          version: v0.11.0
          # shellcheck can't parse zsh (SC1071), and the action discovers scripts
          # by file(1) type, so each zsh file is named here. They aren't skipped:
          # check.sh validates them with `zsh -n` in the static step below.
          ignore_names: fix-ssh.sh .zshenv
      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v23.2.0
        with:
          globs: '**/*.md'
      # zsh -n needs a zsh binary; ubuntu-latest usually ships one, install if not.
      - name: ensure zsh
        run: command -v zsh >/dev/null || { sudo apt-get update && sudo apt-get install -y zsh; }
      # bash -n + zsh -n + JSON parse — same entry point you run locally.
      - run: ./scripts/check.sh static
